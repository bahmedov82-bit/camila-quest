<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camila's Quest">
<meta name="theme-color" content="#2f6bff">
<title>Camila's Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#eef3ff; --bg2:#e4f7f1; --card:#ffffff; --fg:#1f2443; --muted:#5d6486;
  --accent:#ff4fa3; --accent2:#2f6bff; --coin:#ffb400; --good:#19a974; --soft:#f1f3ff; --line:#d9deef; --goodbg:#d8f6ea; --badbg:#ffe0ef;
  --f-display:'Fredoka','Nunito',system-ui,sans-serif; --f-body:'Nunito',system-ui,sans-serif;
  --r:22px; --shadow:0 10px 0 0 #cfd6f2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a33;--bg2:#13262a;--card:#232749;--fg:#f3f4ff;--muted:#b4b9d8;--soft:#2b305a;--line:#3a3f6d;--shadow:0 10px 0 0 #0f1128;--goodbg:#1d4a3a;--badbg:#5a2340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171a33;--bg2:#13262a;--card:#232749;--fg:#f3f4ff;--muted:#b4b9d8;--soft:#2b305a;--line:#3a3f6d;--shadow:0 10px 0 0 #0f1128;--goodbg:#1d4a3a;--badbg:#5a2340;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--fg);font-family:var(--f-body);font-size:19px;line-height:1.45;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:calc(100% - 28px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.3px}
.hud{display:flex;gap:8px;align-items:center;font-family:var(--f-display);font-weight:600;flex-wrap:wrap}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:var(--coin);box-shadow:inset 0 -3px 0 #d79400;display:inline-block}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2.1rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.btn{font-family:var(--f-display);font-weight:600;font-size:1.25rem;border:0;border-radius:18px;padding:16px 22px;cursor:pointer;color:#fff;background:var(--accent2);box-shadow:0 6px 0 0 #1d4fd0;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 0 #1d4fd0}
.btn.pink{background:var(--accent);box-shadow:0 6px 0 0 #c92f7b}.btn.pink:active{box-shadow:0 2px 0 0 #c92f7b}
.btn.ghost{background:var(--soft);color:var(--fg);box-shadow:0 6px 0 0 var(--line)}.btn.ghost:active{box-shadow:0 2px 0 0 var(--line)}
.btn.good{background:var(--good);box-shadow:0 6px 0 0 #0f7a52}.btn.good:active{box-shadow:0 2px 0 0 #0f7a52}
.btn.sm{font-size:1rem;padding:10px 14px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--coin);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.center{text-align:center}
.quests{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.quest{background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;font-family:var(--f-display);text-align:left;cursor:pointer;color:var(--fg);font-size:1.05rem}
.quest .em{font-size:2rem}
.quest.done{border-color:var(--good);background:var(--goodbg)}
.quest.now{border-color:var(--accent);box-shadow:0 0 0 4px #ff4fa333}
.quest.locked{opacity:.55;cursor:default}
.quest .sub{font-size:.9rem;color:var(--muted);font-family:var(--f-body)}
.prompt{font-family:var(--f-display);font-size:2.4rem;font-weight:600;text-align:center;line-height:1.2;text-wrap:balance}
.prompt.small{font-size:1.5rem;font-weight:500}
.word{font-size:3.4rem;letter-spacing:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{font-family:var(--f-display);font-size:2rem;font-weight:600;background:var(--soft);color:var(--fg);border:3px solid var(--line);border-radius:18px;padding:22px 10px;cursor:pointer;min-height:84px}
.opt:active{transform:translateY(2px)}
.opt.right{background:var(--goodbg);border-color:var(--good)} .opt.wrong{background:var(--badbg);border-color:var(--accent)}
.opt.txt{font-size:1.35rem;font-weight:500;text-align:left;padding:16px}
.visual{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:40px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--accent2)}
.dot.b{background:var(--accent)}
.tenframe{display:grid;grid-template-columns:repeat(5,34px);gap:5px;background:var(--card);padding:6px;border:3px solid var(--fg);border-radius:8px}
.cell{width:34px;height:34px;border:2px solid var(--fg);border-radius:6px;display:flex;align-items:center;justify-content:center}
.cell .dot{width:22px;height:22px}
.group{display:flex;gap:4px;padding:6px;border:2px dashed var(--muted);border-radius:10px;flex-wrap:wrap;max-width:140px}
.rod{width:14px;height:90px;background:var(--accent2);border-radius:4px;display:inline-block}
.one{width:16px;height:16px;background:var(--coin);border-radius:3px;display:inline-block}
.bar{height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
.feedback{font-family:var(--f-display);font-size:1.5rem;text-align:center;min-height:1.8em}
.passage{font-size:1.45rem;line-height:1.8;max-width:34em;margin:0 auto;background:var(--soft);padding:18px 22px;border-radius:16px}
.sentence{font-family:var(--f-display);font-size:1.9rem;line-height:1.5;text-align:center;background:var(--soft);padding:18px 22px;border-radius:16px}
.parent{border:3px dashed var(--accent2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.parent .tag{font-family:var(--f-display);font-weight:700;color:var(--accent2);font-size:.95rem;letter-spacing:1px;text-transform:uppercase}
.box{border:3px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.box.gold{border-color:var(--coin)}
input[type=number],input[type=text],input[type=password],select{font:inherit;font-size:1.2rem;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);width:7em}
input[type=text].wide{width:min(90%,22em)}
table{border-collapse:collapse;width:100%;font-size:1rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);color:var(--muted);font-weight:600}
.stars{font-size:2.6rem;letter-spacing:4px;text-align:center}
.big{font-size:3rem;text-align:center;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.speak{background:none;border:2px solid var(--line);border-radius:999px;width:46px;height:46px;font-size:1.3rem;cursor:pointer;color:var(--fg)}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 6px}
.shape{display:grid;gap:3px;border:3px solid var(--fg);border-radius:8px;padding:3px;background:var(--card)}
.shape i{display:block;width:34px;height:34px;background:var(--card);border:1px solid var(--line)}
.shape i.on{background:var(--accent)}
.tableWrap{overflow-x:auto}
.chip{display:inline-block;margin:4px;padding:6px 12px;border-radius:10px;background:var(--soft);font-family:var(--f-display)}
.chip.ok{background:var(--goodbg)} .chip.bad{background:var(--badbg)}
.tword{padding:2px 4px;border-radius:6px;display:inline-block}
.tword.miss{background:var(--accent);color:#fff}
.badge{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:14px;background:var(--soft);min-width:84px;font-size:.8rem;text-align:center}
.badge .em{font-size:1.8rem}
.badge.off{opacity:.35;filter:grayscale(1)}
.streak{font-family:var(--f-display);font-size:1.1rem}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:460px){.prompt{font-size:1.9rem}.word{font-size:2.6rem}.opt{font-size:1.6rem;padding:16px 8px}body{font-size:17px}.sentence{font-size:1.5rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand" id="brand">🏝️ Camila's Quest</div>
    <div class="hud"><span class="pill"><span class="coin"></span><span id="coins">0</span></span><span class="pill">⭐ <span id="stars">0</span></span><span class="pill" id="streakPill">🔥 <span id="streak">0</span></span><button class="pill" id="musicBtn" style="cursor:pointer;font:inherit;color:inherit" aria-pressed="false">🎵 My music: off</button></div>
  </div>
  <div id="prizebar" class="row" style="gap:10px"></div>
  <div class="card" id="screen"></div>
  <p class="muted center" style="font-size:.9rem">Tap 🔊 on any screen to hear it. Take your time, there is no clock. <button id="parentLink" style="background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline">Grown-ups</button> · <span id="ver"></span></p>
</div>
<script>
(function(){
'use strict';
const VERSION='1.0';
// ---------- helpers ----------
const $=id=>document.getElementById(id);
const screen=$('screen');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayNum=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
const median=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round(((s[m-1]+s[m])/2)*10)/10};
function render(html){screen.innerHTML=html;window.scrollTo({top:0})}
function nextBtn(fn,label,cls){const fb=$('fb');const row=document.createElement('div');row.className='row';row.style.justifyContent='center';row.innerHTML='<button class="btn '+(cls||'good')+'" id="nextBtn">'+(label||'Next ➜')+'</button>';(fb?fb.parentNode:screen).appendChild(row);$('nextBtn').onclick=fn;try{$('nextBtn').focus({preventScroll:true})}catch(e){}}
function confetti(){try{const c=document.createElement('div');c.className='confetti';const cols=['#ff4fa3','#2f6bff','#ffb400','#19a974','#9b5cff'];for(let i=0;i<70;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'vw';s.style.background=pick(cols);s.style.animationDelay=(Math.random()*.8)+'s';s.style.transform='rotate('+rnd(0,360)+'deg)';c.appendChild(s)}document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}catch(e){}}

// ---------- persistent state ----------
const KEY='cq-v1';
const D=Object.assign({
  name:'Camila', avatar:'🦄', created:new Date().toISOString(), coins:0, stars:0, dayStars:0, streak:0, lastDay:null,
  days:{}, skills:{}, reading:{level:0,used:[],tricky:{},history:[]}, speech:{level:0,history:[]}, typing:{level:0,history:[]},
  prizes:[{name:'🎧 Headphones',need:30,start:0,earned:null,added:new Date().toISOString()}],
  badges:[], settings:{items:10,breakSecs:45,parentCode:'2013'}, music:false, cur:null
},load());
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function today(){const k=todayKey();if(!D.days[k])D.days[k]={done:[],star:false,items:0,correct:0,secs:0,log:[],breaks:0,started:new Date().toISOString()};return D.days[k]}
function hud(){$('coins').textContent=D.coins;$('stars').textContent=D.stars;$('streak').textContent=D.streak;prizebar()}
function coins(n){D.coins+=n;hud()}
function logItem(mod,rec){const t=today();t.items++;if(rec.ok)t.correct++;if(rec.secs)t.secs+=rec.secs;t.log.push(Object.assign({m:mod,at:Date.now()},rec));save()}

// ---------- voice ----------
let MUSIC=!!D.music;
function setMusic(on){MUSIC=on;D.music=on;save();const b=$('musicBtn');if(b){b.textContent='🎵 My music: '+(on?'on':'off');b.setAttribute('aria-pressed',on?'true':'false');b.style.borderColor=on?'var(--accent)':''}if(on){try{speechSynthesis.cancel()}catch(e){}}}
let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();if(!vs.length)return;const pref=['Samantha','Karen','Ava','Allison','Zoe','Google US English','Microsoft Aria','Microsoft Jenny','Moira','Tessa','Fiona'];for(const n of pref){const v=vs.find(x=>x.name.includes(n)&&x.lang.startsWith('en'));if(v){VOICE=v;return}}VOICE=vs.find(x=>x.lang==='en-US')||vs.find(x=>x.lang.startsWith('en'))||vs[0]}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t,opts){try{opts=opts||{};if(MUSIC&&!opts.force)return;if(!('speechSynthesis'in window))return;if(!opts.queue)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/[*_#]/g,''));u.rate=opts.rate||1.0;u.pitch=opts.pitch||1.2;u.volume=1;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u)}catch(e){}}
const CHEERS=['Yes! You got it!','Boom! Nailed it!','That is right, Camila!','Whoa, great thinking!','Look at you go!','You are on fire!','Amazing, Camila!','Yes yes yes!','Super star!','High five!','Your brain is growing!','That is how a boss does it!'];
const NOTYET=['Not yet, and that is okay. Let\'s look at it together.','So close! Let\'s see how it works.','Good try, Camila. Watch this.','Tricky one! Here is the picture.','Not yet means you are on your way.'];

// ---------- microphone ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let MIC=SR?'unknown':'no';let MICFAIL=0;
function listen(ms){return new Promise(res=>{
  if(!SR){MIC='no';return res({err:'nosr'})}
  let r;try{r=new SR()}catch(e){MIC='no';return res({err:'nosr'})}
  r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
  let done=false;const finish=v=>{if(done)return;done=true;try{r.stop()}catch(e){}res(v)};
  r.onresult=e=>{MIC='yes';const alts=[];for(const a of e.results[0])alts.push(a.transcript);finish({text:alts[0]||'',alts})};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture')MIC='no';if(e.error==='network'){MICFAIL++;if(MICFAIL>=2&&MIC!=='yes')MIC='no'}finish({err:e.error})};
  r.onend=()=>finish({err:'silence'});
  try{r.start()}catch(e){MIC='no';finish({err:'start'})}
  setTimeout(()=>finish({err:'timeout'}),ms||6000);
})}
const norm=t=>String(t||'').toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
const NUMWORDS={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20};
const soundsLike=(a,b)=>{a=norm(a).replace(/'/g,'');b=norm(b).replace(/'/g,'');if(a===b)return true;if(NUMWORDS[a]!==undefined&&String(NUMWORDS[a])===b)return true;if(NUMWORDS[b]!==undefined&&String(NUMWORDS[b])===a)return true;if(a.length>3&&b.length>3&&(a.startsWith(b)||b.startsWith(a)))return true;const f=s=>s.replace(/[aeiouy]/g,'').replace(/(.)\1+/g,'$1');return a.length>3&&f(a)===f(b)&&f(a).length>=2};
function wordMatch(target,said,alts){const T=norm(target).split(' ').filter(Boolean);const all=[said].concat(alts||[]).map(x=>norm(x).split(' '));return T.map(w=>({w,ok:all.some(S=>S.some(x=>soundsLike(w,x)))}))}
function pauseMusicGate(next){
  if(!MUSIC)return next();
  render('<h2 class="center">🎧 This part needs your ears</h2><p class="center">Pause your music for a few minutes, then tap Ready. It comes back after.</p><div class="row" style="justify-content:center"><button class="btn pink" id="go">Ready, music is paused</button></div>');
  $('go').onclick=()=>{setMusic(false);D.musicWasOn=true;save();next()};
}
function resumeMusicHint(){if(D.musicWasOn){D.musicWasOn=false;save();setMusic(true)}}

// ---------- mastery engine ----------
// Each skill has ordered levels. A level is mastered when 5 of the last 6 answers at that level were right
// (and at least 6 answered). Mastered levels come back as quick reviews; two review misses re-open the level.
function sk(key){if(!D.skills[key])D.skills[key]={level:0,hist:{},mastered:[],review:{},reviewMiss:{}};return D.skills[key]}
// hist entries: 0 = wrong or needed a hint, 1 = right, 2 = right and fast (recall, not counting)
function record(key,level,ok,fast){const s=sk(key);const h=s.hist[level]=(s.hist[level]||[]);h.push(ok?(fast?2:1):0);if(h.length>12)h.shift();save()}
function isMastered(key,level){const h=sk(key).hist[level]||[];if(h.length>=4&&h.slice(-4).every(x=>x===2))return true;if(h.length<6)return false;return h.slice(-6).filter(x=>x>0).length>=5}
function levelAcc(key,level){const h=sk(key).hist[level]||[];if(!h.length)return null;return Math.round(100*h.filter(x=>x>0).length/h.length)}
function advanceIfReady(key,max){const s=sk(key);if(isMastered(key,s.level)&&s.level<max-1){if(!s.mastered.includes(s.level))s.mastered.push(s.level);s.review[s.level]=todayKey();s.level++;save();return true}return false}
function dueReview(key){const s=sk(key);const due=s.mastered.filter(l=>s.review[l]!==todayKey());return due.length?due[rnd(0,due.length-1)]:null}
function reviewResult(key,level,ok){const s=sk(key);s.review[level]=todayKey();if(ok){s.reviewMiss[level]=0}else{s.reviewMiss[level]=(s.reviewMiss[level]||0)+1;if(s.reviewMiss[level]>=2){s.mastered=s.mastered.filter(l=>l!==level);s.hist[level]=[];if(level<s.level)s.level=level;s.reviewMiss[level]=0}}save()}

// ---------- day, streak, prizes, badges ----------
const PRIZE_START=D.dayStars;
function prizebar(){const el=$('prizebar');if(!el)return;const active=D.prizes.filter(p=>!p.earned).slice(0,2);el.innerHTML=active.map(p=>{const got=Math.min(p.need,D.dayStars-p.start);const pct=Math.round(100*got/p.need);return '<div class="pill" style="flex:1;min-width:150px;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:8px 14px"><span style="font-size:.95rem">🔒 '+esc(p.name)+' <span class="muted">'+got+'/'+p.need+' days</span></span><div class="bar" style="height:8px"><div style="width:'+pct+'%;background:linear-gradient(90deg,var(--coin),var(--accent))"></div></div></div>'}).join('')}
const BADGES=[
 {id:'first',em:'🌱',name:'First Day',test:()=>D.dayStars>=1},
 {id:'s3',em:'🔥',name:'3-day streak',test:()=>D.streak>=3},
 {id:'s7',em:'🚀',name:'7-day streak',test:()=>D.streak>=7},
 {id:'s14',em:'🌟',name:'14-day streak',test:()=>D.streak>=14},
 {id:'s30',em:'👑',name:'30-day streak',test:()=>D.streak>=30},

function mc(q,answer,distract,visual,spoken,how){
  let opts=new Set([answer]);let tries=0;
  while(opts.size<4&&tries<40){tries++;const d=pick(distract)(answer);if(d!==answer&&d>=0&&Number.isFinite(d)&&Number.isInteger(d))opts.add(d)}
  while(opts.size<4)opts.add(answer+opts.size+1);
  return {q,answer,options:shuffle([...opts]),visual:visual||(()=>''),spoken:spoken||q.replace(/<[^>]+>/g,''),how};
}

const shape=(parts,on)=>{let h='<div class="visual"><div class="shape" style="grid-template-columns:repeat('+Math.min(parts,4)+',34px)">';for(let i=0;i<parts;i++)h+='<i class="'+(i<on?'on':'')+'"></i>';return h+'</div></div>'};

function teachScreen(item,done){
  const T=item.teach||{};TEACH_Q=item.q;
  if(T.type==='on')return countOn(item,done);
  if(T.type==='away')return takeAway(item,done);
  if(T.type==='count')return tapCount(Object.assign({},item,{teach:{groups:T.n,per:1}}),done);
  if(T.type==='missing')return missingAddend(item,done);
  if(T.type==='bridge')return bridgeTen(item,done);
  if(T.type==='ones')return takeOnes(item,done);
  if(T.groups)return tapCount(item,done);
  return explainScreen(item,done);
}

// ---------- Math Quest: today's adaptive set ----------
function genItem(key,level){const L=SKILLS[key].levels[Math.max(0,Math.min(level,SKILLS[key].levels.length-1))];let it=null,g=0;while(!it&&g<40){g++;it=L.g()}return it}
function mathQuest(done){
  const N=D.settings.items||10;let i=0,right=0;const back={},wrongRun={},touched=new Set();let streak=0;
  // Two focus skills per day (the two furthest behind, rotating on ties) get most of the questions, so a level can be mastered in one sitting.
  const open=SKILL_ORDER.filter(skillOpen);const ratio=k=>sk(k).level/SKILLS[k].levels.length+((SKILL_ORDER.indexOf(k)+dayNum())%open.length)*0.001;
  const focus=open.slice().sort((a,b)=>ratio(a)-ratio(b)).slice(0,2);
  function pickSkill(){const w=open.map(k=>focus.includes(k)?3:0.6);let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let j=0;j<open.length;j++){r-=w[j];if(r<=0)return open[j]}return open[0]}
  function next(){
    if(i>=N)return finish();
    let key,level,review=false;
    if(i%4===3){for(const k of shuffle(SKILL_ORDER)){const l=dueReview(k);if(l!==null){key=k;level=l;review=true;break}}}
    if(!key){key=pickSkill();level=Math.max(0,sk(key).level-(back[key]||0))}
    const item=genItem(key,level);const S_=SKILLS[key];touched.add(key);
    showItem(item,{head:S_.em+' '+S_.name+' · '+(review?'quick review':S_.levels[level].n)+' · '+(i+1)+' of '+N,bar:Math.round(100*i/N)},(ok,secs,hinted,given)=>{
      i++;logItem('math',{key,level,ok,secs,hint:hinted,q:item.q.replace(/<[^>]+>/g,''),a:String(item.answer),given,review});
      if(review){reviewResult(key,level,ok)}else{record(key,level,ok&&!hinted,secs<6)}
      if(ok){right++;streak++;wrongRun[key]=0;if(!review&&advanceIfReady(key,S_.levels.length)){return nextBtn(()=>levelUp(key,next),'Next ➜')}return nextBtn(next)}
      streak=0;wrongRun[key]=(wrongRun[key]||0)+1;
      if(wrongRun[key]>=2&&!review&&level>0){back[key]=(back[key]||0)+1;wrongRun[key]=0;return missFlow(item,{head:S_.em+' '+S_.name},()=>stepBack(S_,next))}
      missFlow(item,{head:S_.em+' '+S_.name},next);

function wordsQuest(done){
  const N=6;let i=0,right=0;const lvl=()=>sk('words').level;
  // queue: up to 2 tricky words from stories, then words at her level (never the same word twice in a day)
  const used=new Set(today().log.filter(l=>l.m==='words').map(l=>l.w));
  const tricky=Object.keys(D.reading.tricky).filter(w=>D.reading.tricky[w]>0&&!used.has(w)).slice(0,2);
  function nextWord(){const L=WORDLV[Math.min(lvl(),WORDLV.length-1)];const fresh=L.w.filter(x=>!used.has(x[0]));return pick(fresh.length?fresh:L.w)}
  function next(){
    if(i>=N)return finish();
    let entry,fromStory=false;
    if(tricky.length){const w=tricky.shift();entry=WORDLV.flatMap(l=>l.w).find(x=>x[0]===w)||[w,w,'a word from your story',[]];fromStory=true}
    else entry=nextWord();
    used.add(entry[0]);const [w,syl,tip,dis]=entry;const L=WORDLV[Math.min(lvl(),WORDLV.length-1)];
    readWord(w,syl,tip,dis,{head:'🔤 Word Work · '+(fromStory?'from your story':L.n)+' · '+(i+1)+' of '+N,bar:Math.round(100*i/N)},(ok,mode,heard)=>{
      i++;logItem('words',{w,ok,mode,heard,level:lvl(),fromStory});
      if(fromStory){if(ok)D.reading.tricky[w]=Math.max(0,(D.reading.tricky[w]||1)-1)}else record('words',lvl(),ok,true);
      if(ok){right++;coins(2)}
      if(!fromStory&&advanceIfReady('words',WORDLV.length)){return nextBtn(()=>{confetti();render('<div class="stars pop">📚⭐</div><h2 class="center">Reading level up!</h2><p class="center">You mastered <b>'+WORDLV[lvl()-1].n+'</b>. Next: <b>'+WORDLV[lvl()].n+'</b>.</p><div class="row" style="justify-content:center"><button class="btn good" id="go">Keep going!</button></div>');speak('Reading level up! You mastered '+WORDLV[lvl()-1].n+'.');coins(5);$('go').onclick=next})}
      nextBtn(next);
    });
  }
  function finish(){D.stars+=1;coins(8);save();completeQuest('words','You read '+right+' of '+N+' words out loud. Level: '+WORDLV[Math.min(lvl(),WORDLV.length-1)].n+'.',done)}

 {lv:0,title:'Zoe\'s Dog Walks',concept:'service',meaning:'work you do for someone, instead of a thing you sell',text:'Zoe loves dogs. Her neighbor Mr. Diaz has a dog named Pepper. He is too busy to walk her. Zoe has an idea. "I will walk Pepper for two dollars," she says. Mr. Diaz says yes. Zoe is not selling a thing. She is selling a service. A service is work you do for someone. Zoe walks Pepper every day after school. Pepper is happy. Mr. Diaz is happy. Soon three more neighbors ask Zoe to walk their dogs. Zoe makes a list so she does not forget anyone.',
  qs:[['What is a service?','Work you do for someone','A dog named Pepper','A list of names','Two dollars'],['Why did Mr. Diaz need help?','He was too busy to walk Pepper','He did not like dogs','He was sick','He moved away'],['Why did Zoe make a list?','So she would not forget any dog','To sell it','For homework','To count money']],order:['Zoe offers to walk Pepper','Zoe walks Pepper every day','Three more neighbors ask for help'],keys:['dog','walk','pepper','neighbor','service','dollars','list','school']},
 {lv:0,title:'Max Counts His Cost',concept:'cost',meaning:'the money you spend to make or get what you sell',text:'Max wants to sell cookies. First he buys flour, sugar, eggs, and chocolate chips. He spends six dollars. That is his cost. The cost is the money you spend to make what you sell. Max bakes twelve cookies. He sells each cookie for one dollar. At the end he has twelve dollars in his jar. But six of those dollars pay back his cost. So Max really made six dollars. "Next time I will buy on sale," he says. "Then my cost will be smaller."',
  qs:[['What is the cost?','The money you spend to make what you sell','The money in the jar','One cookie','A chocolate chip'],['How much did Max spend on ingredients?','$6','$12','$1','$18'],['How can Max make his cost smaller?','Buy ingredients on sale','Bake fewer cookies','Sell for less','Eat the cookies']],order:['Max buys flour, sugar, and eggs','Max bakes twelve cookies','Max counts twelve dollars in his jar'],keys:['cookies','flour','sugar','six','dollars','cost','jar','sale']},
 // level 1
 {lv:1,title:'The Muffin Route',concept:'profit',meaning:'the money left after you pay your cost',text:'Every Saturday, Camila packs her wagon with muffins. She bought them at the store for one dollar each. That is her cost. She sells each one for two dollars. All the money customers pay her is called revenue. The money left after she pays her cost is called profit. If she sells ten muffins, her revenue is twenty dollars, her cost is ten dollars, and her profit is ten dollars. Camila started with twenty-five dollars. After one month of walking her route, her profit grew to more than two hundred dollars. Her secret was simple: she showed up every Saturday, even when it was cold, and she was always friendly.',
  qs:[['What is profit?','The money left after paying the cost','The price of a muffin','All the money customers pay','The money she spends at the store'],['If she sells 10 muffins for $2 each, what is her revenue?','$20','$10','$2','$25'],['What was Camila\'s secret?','She showed up every Saturday and was friendly','She had the cheapest muffins','She had a big sign','She sold only in summer']],order:['Camila buys muffins for one dollar each','She sells them for two dollars each','Her profit grows to more than two hundred dollars'],keys:['saturday','wagon','muffins','cost','revenue','profit','friendly','cold']},
 {lv:1,title:'Two Stands on Pine Street',concept:'competition',meaning:'when two businesses sell the same thing to the same customers',text:'Two kids on Pine Street opened lemonade stands on the same hot Saturday. Jordan set up first, put out a sign that said one dollar, and waited. Across the street, Tasha asked every customer one question: "What would make this better?" One said colder. One said smaller cups for little kids. One said a cookie to go with it. By noon Tasha had a cooler of ice, two cup sizes, and a plate of cookies. When two businesses sell the same thing to the same customers, that is called competition. Competition is not about yelling louder. It is about listening better. By the end of the day, Tasha had sold out and Jordan had a full pitcher. On Sunday, Jordan walked over and asked Tasha for advice. She told him everything. That is how good competitors become friends.',
  qs:[['What is competition?','Two businesses selling the same thing to the same customers','A race on Pine Street','A kind of lemonade','Yelling louder than the other stand'],['Why did Tasha sell out?','She listened to customers and changed things','Her lemonade was cheaper','She started first','She had a bigger sign'],['What did Jordan do on Sunday?','Asked Tasha for advice','Closed his stand forever','Made his lemonade free','Moved to another street']],order:['Jordan sets up his stand first','Tasha asks customers what would make it better','Jordan asks Tasha for advice'],keys:['lemonade','jordan','tasha','customer','ice','cookies','competition','advice']},
 {lv:1,title:'Bee Sweet',concept:'giving back',meaning:'using some of your profit to help a cause you care about',text:'This is a true story. When Mikaila Ulmer was four, a bee stung her twice in one week. Instead of staying scared, she got curious. She learned that bees were disappearing, and that without bees, many plants cannot grow food. Her great-grandmother had an old recipe for lemonade sweetened with honey. Mikaila started selling it at a stand in Austin, Texas, and called her company Me and the Bees. She decided to give part of her profit to groups that protect bees. That is called giving back. Years later, her lemonade was sold in big grocery stores, and she went on television to find people who would invest in her company. She started with one small stand, one old recipe, and one good reason.',
  qs:[['What does giving back mean?','Using some profit to help a cause','Returning lemonade to the store','Paying back a loan','Giving refunds'],['Why did Mikaila care about bees?','Bees help plants grow food and were disappearing','Bees are yellow','Her teacher told her to','Bees make lemonade'],['What was special about her lemonade?','It was sweetened with honey','It was blue','It was free','It came in a can']],order:['A bee stings Mikaila twice','She sells honey lemonade at a stand','Her lemonade is sold in big grocery stores'],keys:['bee','stung','honey','lemonade','recipe','texas','profit','stores']},
 {lv:1,title:'The Snack Machine',concept:'inventory',meaning:'the supply of things you have waiting to be sold',text:'Vending machines are a quiet business. Once a machine sits in a good spot, like a gym or an office lobby, it sells snacks all day without anyone standing next to it. The owner visits once or twice a week to restock the inventory. Inventory is the supply of snacks waiting inside the machine to be sold. If a machine runs out of pretzels, customers who wanted pretzels walk away, and that is a lost sale. If the machine has too many of a snack nobody buys, that money is stuck inside. Smart owners keep a notebook. They write down what sells fastest and what sits. Then they fill the machine with more of what people actually want.',
  qs:[['What is inventory?','The supply of things waiting to be sold','The price of a snack','A kind of machine','The owner of the machine'],['What happens when the machine runs out of pretzels?','Customers walk away, a lost sale','The machine breaks','Customers buy two chips','Nothing'],['Why do owners keep a notebook?','To track what sells fast and what sits','To draw pictures','For school','To count the days']],order:['The owner puts a machine in a busy spot','Customers buy snacks all day','The owner restocks the inventory'],keys:['machine','snacks','gym','inventory','pretzels','notebook','sells','restock']},
 // level 2
 {lv:2,title:'Mo\'s Bow Ties',concept:'brand',meaning:'the name and look that makes people remember your business',text:'This is a true story. Moziah Bridges liked to dress sharp, but he could not find bow ties he liked. So when he was nine, his grandmother taught him to sew, and he started making his own from bright scraps of fabric. He called his company Mo\'s Bows. Friends noticed. Then strangers noticed. Moziah learned that a brand is the name and the look that make people remember you. His brand was colorful, polite, and proud, and every tie came with a little card signed by Mo himself. He sold his bow ties online and in small shops in Memphis, Tennessee. Later he appeared on a television show where business owners ask investors for money. He walked away with something better than a check: a mentor who gave him advice for years. By the time he was a teenager, Mo\'s Bows had sold hundreds of thousands of dollars of bow ties.',
  qs:[['What is a brand?','The name and look that make people remember your business','A kind of bow tie','A television show','A sewing machine'],['Who taught Moziah to sew?','His grandmother','His teacher','An investor','A shop owner'],['What did Moziah get from the television show?','A mentor who gave him advice','A new house','A car','Nothing']],order:['Moziah cannot find bow ties he likes','His grandmother teaches him to sew','He appears on a television show'],keys:['bow','ties','grandmother','sew','brand','memphis','television','mentor']},
 {lv:2,title:'Location, Location',concept:'location',meaning:'where your business is; a busy spot brings more customers',text:'Priya and her brother Dev built a smoothie cart out of an old wagon and a cooler. On Monday they parked it at the end of their quiet street. They sold two smoothies all afternoon. On Tuesday, Dev had an idea. "The soccer fields are packed after practice, and everybody is hot and thirsty." They pulled the cart to the fields. They sold out in forty minutes. Same cart, same smoothies, same price. The only thing that changed was the location. Location means where your business is. A busy spot with the right customers can matter more than almost anything else. On Wednesday they asked the coach if they could come back every practice. He said yes, as long as they picked up every cup. They did.',
  qs:[['What changed between Monday and Tuesday?','The location','The price','The smoothies','The weather'],['Why were the soccer fields a good location?','Lots of hot, thirsty people were there','It was quiet','It was close to home','There was shade'],['What did the coach ask them to do?','Pick up every cup','Pay him money','Give free smoothies','Leave']],order:['They sell two smoothies on a quiet street','They move the cart to the soccer fields','They ask the coach to come back'],keys:['smoothie','cart','wagon','street','soccer','fields','location','coach','cups']},
 {lv:2,title:'The Car Wash Team',concept:'teamwork',meaning:'splitting the work so each person does what they do best',text:'Six friends wanted to raise money for a class trip, so they planned a car wash. At first everybody did everything, and it was a mess. Buckets tipped over. Two people dried the same car while another car sat dripping. Then Amara stopped the group. "Let\'s each take one job." Ben waved cars in with a sign. Lucy sprayed. Two friends soaped. Amara and Jonah dried. Suddenly cars moved through like a train. That is teamwork: splitting the work so each person does the part they do best. They washed thirty-one cars at five dollars each. At the end, Amara counted the money twice, because a good business always counts twice. One hundred fifty-five dollars. The trip was on.',
  qs:[['What is teamwork, in this story?','Splitting the work so each person does one job','Everybody doing everything','Washing cars alone','Counting money'],['Why was the car wash a mess at first?','Everybody did everything at once','It rained','They had no soap','Nobody came'],['Why did Amara count the money twice?','A good business always counts twice','She forgot the first number','Ben told her to','She was bored']],order:['Everyone does every job and it is a mess','Amara gives each person one job','They count one hundred fifty-five dollars'],keys:['car','wash','friends','trip','job','teamwork','soap','dried','dollars','counted']},
 {lv:2,title:'Nadia Saves Up',concept:'saving',meaning:'keeping part of your money instead of spending it, so it is there when you need it',text:'Nadia braided hair for the girls on her block, four dollars a braid. Every Friday she had about twenty dollars. The first month she spent all of it on candy and stickers. By Thursday she always had nothing. Her aunt gave her three jars. "Spend, Save, and Grow." Each Friday, Nadia put ten dollars in Spend, six in Save, and four in Grow. Saving means keeping part of your money instead of spending it, so it is there when you need it. Two months later, her favorite hair clips broke. She did not have to ask anyone. She opened the Save jar. And the Grow jar? That one bought new ribbons and beads, so she could charge more for fancy braids. Her business got bigger because she did not spend everything.',
  qs:[['What does saving mean?','Keeping part of your money so it is there when you need it','Spending money on candy','Braiding hair','Asking for money'],['What was the Grow jar for?','Buying things that help the business grow','Candy','Clips','Nothing'],['Why did Nadia not have to ask anyone when her clips broke?','She had money in her Save jar','Her aunt bought new ones','She stopped braiding','She found money']],order:['Nadia spends all her money on candy','Her aunt gives her three jars','The Grow jar buys ribbons and beads'],keys:['braid','hair','dollars','jars','spend','save','grow','aunt','ribbons','clips']},
 // level 3
 {lv:3,title:'Cory\'s Cookies',concept:'goal',meaning:'something specific you are working toward, with a plan to get there',text:'This is a true story. When Cory Nieves was six years old, he was tired of taking the bus in Englewood, New Jersey. He told his mom he wanted to buy her a car. That was his goal: something specific he was working toward. A goal without a plan is just a wish, so Cory made a plan. He started by selling hot cocoa on cold days. Then he and his mom worked on a cookie recipe, testing batch after batch until the chocolate chip cookie was exactly right. He named the business Mr. Cory\'s Cookies and wore a bow tie and a suit when he sold them, because he wanted customers to know he took his work seriously. Orders grew from neighbors to parties to stores. Cory learned that a big goal is really a line of small goals: a good recipe, a first customer, a first store, a first hundred boxes. One at a time.',
  qs:[['What is a goal?','Something specific you work toward with a plan','A kind of cookie','A bus ride','A bow tie'],['Why did Cory wear a suit and bow tie?','To show customers he took his work seriously','It was cold','His mom made him','For a party'],['What did Cory learn about big goals?','A big goal is a line of small goals','Big goals are impossible','You need a car first','Wishes come true']],order:['Cory decides he wants to buy his mom a car','He sells hot cocoa on cold days','He perfects his chocolate chip cookie recipe'],keys:['cookies','cocoa','mom','car','goal','plan','recipe','bow','tie','store']},
 {lv:3,title:'The Ad on the Fence',concept:'advertising',meaning:'telling people about your product so they know it exists and want it',text:'Sam\'s lawn-mowing business had a problem that had nothing to do with grass. Sam was good at mowing. Nobody knew. He had two customers, both relatives. His cousin Rosa, who was in high school, asked him one question: "How would a stranger ever find out about you?" Sam had no answer. Together they made twenty bright yellow flyers with a photo of a freshly mowed lawn and three words: Neat. Fast. Ten dollars. They put them on fences and in mailboxes along four streets. That is advertising: telling people about your product so they know it exists and want it. Within a week Sam had nine customers. Then Rosa taught him the second lesson. "An ad gets you the first job. Doing great work gets you the second." Sam mowed straight lines, swept the sidewalk, and said thank you. By summer\'s end he had a waiting list.',
  qs:[['What is advertising?','Telling people about your product so they know it exists','Mowing lawns','Asking relatives for money','Sweeping sidewalks'],['What was Sam\'s problem?','Nobody knew about his business','He was bad at mowing','He had too many customers','His mower broke'],['What gets you the second job?','Doing great work','A second flyer','Lower prices','A bigger sign']],order:['Sam has only two customers, both relatives','Sam and Rosa put up yellow flyers','Sam has a waiting list by the end of summer'],keys:['mowing','lawn','flyers','yellow','advertising','customers','rosa','work','waiting','list']},
 {lv:3,title:'Supply and Demand at the Fair',concept:'supply and demand',meaning:'when many people want something and there is little of it, the price goes up; when few want it, the price goes down',text:'At the county fair, Elena sold hand-painted fans. On the first morning, it was cool and cloudy. Nobody wanted a fan. She dropped the price to two dollars and still sold only three. By two o\'clock the sun came out and the fairground turned into an oven. Suddenly there was a line at her table. Elena had only twenty fans left. She raised the price to five dollars, and the line did not get any shorter. This is supply and demand. Supply is how much of something there is. Demand is how many people want it. When demand is high and supply is low, the price can go up. When demand is low, the price goes down. Elena sold out by four. That night she painted thirty more fans, and she also checked the weather for the next day.',
  qs:[['What is demand?','How many people want something','How many fans Elena has','The price of a fan','The weather'],['Why could Elena raise the price in the afternoon?','Many people wanted fans and she had few left','It was cloudy','She had too many fans','Her paint was expensive'],['What did Elena do that night?','Painted more fans and checked the weather','Went to sleep early','Lowered her price','Closed her business']],order:['Nobody wants fans on the cool morning','The sun comes out and a line forms','Elena sells out and paints more that night'],keys:['fair','fans','painted','cloudy','sun','line','price','supply','demand','weather']},
 {lv:3,title:'Quality Over Quick',concept:'quality',meaning:'how well something is made; good quality brings customers back',text:'Two cousins made friendship bracelets to sell at school. Kenji made his fast, ten a day, with loose knots. Mina made four a day, pulling each knot tight and checking the pattern. The first week, Kenji sold more. The second week, kids came back to Kenji with broken bracelets and asked for their money back. Nobody came back to Mina, except to buy another one for a friend. Quality means how well something is made. Good quality costs more time at the start, but it brings customers back and sends new ones to you. Kenji did not give up. He asked Mina to show him her knot. He slowed down to six bracelets a day. Not one came back broken. By the end of the month, the cousins had merged into one business with a simple promise written on their sign: Made to last.',
  qs:[['What is quality?','How well something is made','How fast something is made','How much something costs','A kind of knot'],['Why did kids come back to Kenji?','Their bracelets broke and they wanted money back','To buy more','To say thank you','To learn knots'],['What did Kenji do after the second week?','Asked Mina to teach him and slowed down','Quit','Made bracelets even faster','Lowered his price']],order:['Kenji makes ten loose bracelets a day','Kids return with broken bracelets','The cousins merge into one business'],keys:['bracelets','kenji','mina','knots','broken','quality','slow','promise','last','cousins']},
 // level 4
 {lv:4,title:'Zollipops',concept:'problem solving',meaning:'finding a need that people have and making something that fixes it',text:'This is a true story. Alina Morse was seven years old when a bank teller offered her a lollipop. Her dad reminded her that sugar is bad for teeth, and Alina asked a question most people never ask: why can\'t somebody make a lollipop that is actually good for your teeth? She and her dad spent almost two years researching sweeteners that dentists approve of, testing recipes, and tasting a lot of bad candy. In 2014 she launched Zollipops, sugar-free lollipops that help clean teeth after a meal. The business grew into stores across the country, and Alina used part of her profit to give away candy and teach kids about brushing. Her story shows the first rule of starting a business: find a real problem that real people have, then build the thing that fixes it. The idea does not have to be fancy. It has to be useful.',
  qs:[['What is the first rule of starting a business, according to the story?','Find a real problem and build the thing that fixes it','Make the fanciest product','Start when you are seven','Sell candy'],['What problem did Alina notice?','Lollipops are bad for teeth','Banks are boring','Candy was too expensive','Dentists are scary'],['How long did she research before launching?','Almost two years','One week','Ten years','One day']],order:['A bank teller offers Alina a lollipop','She researches sweeteners with her dad','She launches Zollipops in stores'],keys:['lollipop','teeth','sugar','dad','research','dentists','zollipops','stores','problem','useful']},
 {lv:4,title:'The Loan',concept:'loan and interest',meaning:'borrowed money you must pay back, plus a little extra called interest',text:'Darius wanted to sell custom phone cases at the holiday market, but the blank cases and the printer ink cost eighty dollars, and he had thirty. His older sister offered a deal. "I will lend you fifty dollars. You pay me back fifty-five after the market." Darius hesitated. "Why fifty-five?" "The extra five is interest," she said. "It is the price of using my money instead of yours. And it is a reminder to make a plan to pay it back." A loan is borrowed money that you must pay back, and interest is the extra you pay for borrowing it. Darius did the math before he said yes. If he sold forty cases at six dollars, that was two hundred forty dollars of revenue. Minus eighty for supplies, minus fifty-five for his sister, he would keep one hundred five. He said yes, sold forty-three cases, and paid his sister first, before he spent a dollar on himself. She told him that is what every good borrower does.',
  qs:[['What is interest?','The extra you pay for borrowing money','The price of a phone case','Money you keep','A kind of printer'],['Why did Darius do the math before saying yes?','To make sure he could pay the loan back and still keep money','To impress his sister','For homework','He did not do the math'],['What did Darius do first after the market?','Paid his sister back','Bought himself a gift','Bought more cases','Went on vacation']],order:['Darius needs eighty dollars and has thirty','His sister lends him fifty with five dollars interest','Darius sells forty-three cases and pays her back first'],keys:['phone','cases','market','sister','loan','interest','fifty','math','revenue','paid']},
 {lv:4,title:'Reinvest',concept:'reinvesting',meaning:'putting profit back into the business so it can grow',text:'After her first summer, Jun\'s bubble tea cart had earned three hundred dollars of profit. Her friends told her to buy the sneakers she had wanted all year. Jun almost did. Then she wrote two lists. On the left: what she would have after buying the sneakers. Sneakers, and a cart that still could not keep drinks cold enough on hot days. On the right: what she would have if she spent the money on a real cooler and a second blender. No sneakers yet, but a cart that could serve twice as many customers twice as fast. She chose the right side. That is reinvesting: putting profit back into the business so it can grow. Her second summer she earned nine hundred dollars. She bought the sneakers in September, paid for by a business that was three times bigger because she had waited. Patience, she decided, was the best tool on the cart.',
  qs:[['What is reinvesting?','Putting profit back into the business so it can grow','Buying sneakers','Making two lists','Working a second summer'],['What did Jun buy with her first profit?','A real cooler and a second blender','Sneakers','A new cart','Nothing'],['Why did she earn more the second summer?','Her cart could serve more customers faster','It was hotter','Her friends helped','She raised prices']],order:['Jun earns three hundred dollars of profit','She buys a cooler and a blender instead of sneakers','She earns nine hundred dollars the next summer'],keys:['bubble','tea','cart','profit','sneakers','cooler','blender','reinvest','summer','patience']},
 {lv:4,title:'The Budget Meeting',concept:'budget',meaning:'a plan for how much money comes in and how much goes out',text:'The three founders of Pop and Lock Popcorn met at the kitchen table every Sunday night for what they called the budget meeting. Omar brought the notebook. Keisha brought the money box. Theo brought the calculator and, usually, snacks. A budget is a plan for how much money comes in and how much goes out, written down before you spend it. They listed what they expected to earn that week at the farmers market: about one hundred twenty dollars. Then they listed costs: kernels, butter, bags, salt, and the table fee, about fifty-five dollars. That left about sixty-five dollars. They decided in advance how to use it: twenty each in pay, and five into the Fix-It fund for when the popper finally broke. When the popper did break in October, nobody panicked. The Fix-It fund had ninety dollars in it. A budget, Omar said, is how a business stops being surprised by its own money.',
  qs:[['What is a budget?','A written plan for money coming in and going out','A money box','A popcorn machine','A Sunday snack'],['Why did nobody panic when the popper broke?','They had saved a Fix-It fund in their budget','It was cheap','Theo fixed it','They closed the business'],['What did the founders do every Sunday?','Met to plan the week\'s money','Sold popcorn','Bought a new popper','Went to the market']],order:['The founders meet at the kitchen table','They plan costs, pay, and a Fix-It fund','The popper breaks and the fund pays for it'],keys:['popcorn','budget','sunday','notebook','market','costs','fund','popper','broke','plan']},
];
function pickStory(){const lv=Math.max(0,Math.min(4,D.reading.level));let pool=STORIES.filter(s=>s.lv===lv&&!D.reading.used.includes(s.title));if(!pool.length){D.reading.used=D.reading.used.filter(t=>!STORIES.find(s=>s.title===t&&s.lv===lv));pool=STORIES.filter(s=>s.lv===lv)}return pick(pool)}
const sentences=t=>t.match(/[^.!?"]+[.!?"]+["']?\s*|[^.!?"]+$/g).map(s=>s.trim()).filter(Boolean).reduce((acc,s)=>{if(acc.length&&(s.length<18||/^["']/.test(s)))acc[acc.length-1]+=' '+s;else acc.push(s);return acc},[]);

function storyQuest(done){
  const ST=pickStory();const sents=sentences(ST.text);const res={title:ST.title,lv:ST.lv,date:todayKey(),words:ST.text.split(/\s+/).length,checked:0,missed:[],comp:0,order:false,retell:null,mode:'mic'};
  function intro(){
    render('<div class="stars">📖</div><h2 class="center">'+ST.title+'</h2><div class="box gold"><span class="tag" style="color:var(--coin);font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:.9rem">Today\'s business word</span><p class="prompt small" style="text-align:left"><b>'+ST.concept+'</b></p><p style="font-size:1.2rem">'+ST.meaning+'</p></div><p class="center muted">You will read the story out loud one line at a time. I listen. Then three questions, put it in order, and tell it back.</p><div class="row" style="justify-content:center"><button class="btn good" id="go">Start the story</button></div>');
    speak('Story time! '+ST.title+'. Today\'s business word is '+ST.concept+'. '+ST.meaning+'. Read each line out loud, and I will listen.',{force:true});
    $('go').onclick=()=>MIC==='no'?silentRead():readLine(0);
  }
  // read aloud, one sentence at a time
  function readLine(k){
    if(k>=sents.length)return afterReading();
    const s=sents[k];let fails=0;
    render('<div class="row" style="justify-content:space-between"><span class="muted">📖 '+ST.title+' · line '+(k+1)+' of '+sents.length+'</span></div><div class="bar"><div style="width:'+Math.round(100*k/sents.length)+'%"></div></div><p class="prompt small muted">Read this line out loud. Tap <b>Read it</b>, then read.</p><div class="sentence" id="sent">'+esc(s)+'</div><div class="row" style="justify-content:center"><button class="btn pink" id="say" style="font-size:1.5rem">🎙️ Read it</button><button class="btn ghost sm" id="hear">🔊 Help, read it to me</button></div><p class="feedback" id="fb"></p><div id="chips" class="center"></div>');
    if(k===0)speak('Tap Read it, then read the line out loud.',{force:true});
    $('hear').onclick=()=>{speak(s,{force:true,rate:.85});res.helped=(res.helped||0)+1};
    $('say').onclick=async()=>{$('say').disabled=true;$('fb').textContent='Listening… read the whole line';const r=await listen(Math.min(15000,3500+s.length*90));{const sb=$('say');if(sb)sb.disabled=false};
      if(r.err&&MIC==='no'){res.mode='silent';return silentRead()}
      if(r.err){fails++;if(fails>=2){$('fb').textContent='I could not hear that line. Let\'s move on.';return nextBtn(()=>readLine(k+1))}$('fb').textContent='I did not catch that. Tap Read it and read a little louder.';return}
      const m=wordMatch(s,r.text,r.alts).filter(x=>x.w.length>2);const miss=m.filter(x=>!x.ok).map(x=>x.w);res.checked+=m.length;
      $('chips').innerHTML=m.map(x=>'<span class="chip '+(x.ok?'ok':'bad')+'">'+x.w+'</span>').join('');
      if(!miss.length||miss.length<=Math.max(0,Math.floor(m.length*0.1))){$('fb').textContent=pick(CHEERS);speak(pick(CHEERS));coins(2);return nextBtn(()=>readLine(k+1))}

let AC=null;
function beatStart(bpm){if(MUSIC)return ()=>{};try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return ()=>{}}
  const period=60/bpm;let n=0;let stopped=false;
  function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.3)}
  function hat(t){const b=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const src=AC.createBufferSource();src.buffer=b;const g=AC.createGain();g.gain.value=.25;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6000;src.connect(f).connect(g).connect(AC.destination);src.start(t)}
  function clap(t){const b=AC.createBuffer(1,AC.sampleRate*.12,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const src=AC.createBufferSource();src.buffer=b;const g=AC.createGain();g.gain.value=.5;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;src.connect(f).connect(g).connect(AC.destination);src.start(t)}
  function tick(){if(stopped)return;const t=AC.currentTime+.05;kick(t);hat(t+period/2);if(n%2===1)clap(t);n++;setTimeout(tick,period*1000)}
  tick();return ()=>{stopped=true};
}

  lines.push('','Math levels:');SKILL_ORDER.forEach(k=>lines.push('  '+SKILLS[k].name+': '+lvName(k)+(levelAcc(k,sk(k).level)!==null?' · '+levelAcc(k,sk(k).level)+'% at this level':'')+' · mastered '+sk(k).mastered.length));
  lines.push('Word Work level: '+WORDLV[Math.min(sk('words').level,WORDLV.length-1)].n,'Stories level: '+(D.reading.level+2)+'th-grade-ish · read '+D.reading.history.filter(h=>h.title).length,'Echo Stage level: '+SPEECHLV[Math.min(sk('speech').level,SPEECHLV.length-1)].n,'Typing level: '+TYPELV[Math.min(sk('typing').level,TYPELV.length-1)].n);
  const tr=Object.keys(D.reading.tricky).filter(w=>D.reading.tricky[w]>0);if(tr.length)lines.push('Words to practice: '+tr.join(', '));
  const misses=t.log.filter(l=>l.m==='math'&&!l.ok).slice(0,12).map(l=>l.q+' (said '+l.given+', answer '+l.a+')');if(misses.length)lines.push('','Math misses today:',...misses.map(m=>'  '+m));
  return lines.join('\n');
}
function parentGate(){
  render('<h2>Grown-ups</h2><p class="muted">Enter the code (hint: the year Camila was born).</p><div class="row"><input type="password" id="code" inputmode="numeric" placeholder="code"><button class="btn" id="go">Open</button><button class="btn ghost" id="back">Back</button></div><p class="feedback" id="fb"></p>');
  $('go').onclick=()=>{if($('code').value===(D.settings.parentCode||'2013'))parentPanel();else $('fb').textContent='Not that one.'};$('back').onclick=home;$('code').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
}
function parentPanel(tab){
  tab=tab||'today';const t=today();
  const tabs=[['today','Today'],['skills','Skills'],['history','History'],['prizes','Prizes'],['settings','Settings'],['report','Report']];
  let body='';
  if(tab==='today'){const acc=t.items?Math.round(100*t.correct/t.items):0;body='<p><b>'+t.done.length+' of 6</b> quests · '+t.items+' answers · '+acc+'% right · ~'+Math.round(t.secs/60)+' min answering · '+t.breaks+' breaks</p><table><tr><th>Quest</th><th>Result</th></tr>'+QUESTS.map(q=>'<tr><td>'+q.em+' '+q.name+'</td><td>'+esc((t.summaries||{})[q.key]||(t.done.includes(q.key)?'done':'—'))+'</td></tr>').join('')+'</table><h3>Misses today</h3>'+(t.log.filter(l=>!l.ok).length?'<ul style="margin:0;padding-left:20px;font-size:1rem">'+t.log.filter(l=>!l.ok).map(l=>'<li>'+esc(l.m==='math'||l.m==='sparks'?l.q+' → she said '+l.given+' (answer '+l.a+')':l.m==='words'?'word: '+l.w+(l.heard?' (heard "'+l.heard+'")':''):l.m==='speech'?'speech: '+l.t:l.m==='typing'?'typed "'+l.typed+'" for '+l.t:JSON.stringify(l))+'</li>').join('')+'</ul>':'<p class="muted">None yet.</p>')}
  if(tab==='skills'){body='<table><tr><th>Skill</th><th>Where she is</th><th>Set level</th></tr>'+SKILL_ORDER.map(k=>'<tr><td>'+SKILLS[k].em+' '+SKILLS[k].name+'</td><td>'+esc(lvName(k))+(levelAcc(k,sk(k).level)!==null?'<br><span class="muted">'+levelAcc(k,sk(k).level)+'% right at this level · mastered '+sk(k).mastered.length+'</span>':'')+(skillOpen(k)?'':'<br><span class="muted">locked until basics are ready</span>')+'</td><td><select data-k="'+k+'" class="setlv">'+SKILLS[k].levels.map((L,i)=>'<option value="'+i+'" '+(i===sk(k).level?'selected':'')+'>'+(i+1)+'. '+L.n+'</option>').join('')+'</select></td></tr>').join('')+'<tr><td>🔤 Word Work</td><td>'+WORDLV[Math.min(sk('words').level,WORDLV.length-1)].n+'</td><td><select data-k="words" class="setlv">'+WORDLV.map((L,i)=>'<option value="'+i+'" '+(i===sk('words').level?'selected':'')+'>'+(i+1)+'. '+L.n+'</option>').join('')+'</select></td></tr><tr><td>📖 Stories</td><td>level '+(D.reading.level+1)+' of 5 · '+D.reading.history.filter(h=>h.title).length+' read</td><td><select id="setStory">'+[0,1,2,3,4].map(i=>'<option value="'+i+'" '+(i===D.reading.level?'selected':'')+'>'+(i+1)+' (~grade '+(i+2)+')</option>').join('')+'</select></td></tr><tr><td>🎤 Echo Stage</td><td>'+SPEECHLV[Math.min(sk('speech').level,SPEECHLV.length-1)].n+'</td><td><select data-k="speech" class="setlv">'+SPEECHLV.map((L,i)=>'<option value="'+i+'" '+(i===sk('speech').level?'selected':'')+'>'+(i+1)+'. '+L.n+'</option>').join('')+'</select></td></tr><tr><td>⌨️ Typing</td><td>'+TYPELV[Math.min(sk('typing').level,TYPELV.length-1)].n+'</td><td><select data-k="typing" class="setlv">'+TYPELV.map((L,i)=>'<option value="'+i+'" '+(i===sk('typing').level?'selected':'')+'>'+(i+1)+'. '+L.n+'</option>').join('')+'</select></td></tr></table><p class="muted" style="font-size:.95rem">Levels move up on their own when she gets 5 of the last 6 right. Only change them by hand if a level is clearly wrong for her.</p><h3>Words to practice</h3><p>'+(Object.keys(D.reading.tricky).filter(w=>D.reading.tricky[w]>0).map(w=>'<span class="chip bad">'+w+'</span>').join('')||'<span class="muted">none</span>')+'</p><h3>Recent stories</h3>'+(D.reading.history.filter(h=>h.title).slice(-5).reverse().map(h=>'<p style="font-size:1rem">'+h.date+' · <b>'+esc(h.title)+'</b> · '+h.comp+'/3 questions'+(h.acc!==null&&h.acc!==undefined?' · '+h.acc+'% words':'')+(h.retell&&h.retell.hits!==undefined?' · retell '+h.retell.hits+'/'+h.retell.of+' key ideas':'')+'</p>').join('')||'<p class="muted">none yet</p>')}
  if(tab==='history'){const keys=Object.keys(D.days).sort().reverse().slice(0,21);body='<table><tr><th>Day</th><th>Star</th><th>Quests</th><th>Answers</th><th>Right</th></tr>'+keys.map(k=>{const d=D.days[k];return '<tr><td>'+k+'</td><td>'+(d.star?'⭐':'')+'</td><td>'+d.done.length+'/6</td><td>'+d.items+'</td><td>'+(d.items?Math.round(100*d.correct/d.items)+'%':'')+'</td></tr>'}).join('')+'</table>'+badgesHTML()}
  if(tab==='prizes'){body='<p class="muted" style="font-size:.95rem">A prize is earned by finishing whole days (a day star = all six quests). Each prize counts from the day it was added, so every prize is earned on its own.</p>'+D.prizes.map((p,i)=>'<div class="box"><div class="row" style="justify-content:space-between"><b>'+(p.earned?'✅ ':'🔒 ')+esc(p.name)+'</b><span class="muted">'+(p.earned?'earned '+p.earned:Math.min(p.need,D.dayStars-p.start)+' of '+p.need+' days')+'</span></div><div class="row"><button class="btn ghost sm rmP" data-i="'+i+'">Remove</button>'+(p.earned?'':'<button class="btn ghost sm doneP" data-i="'+i+'">Mark given</button>')+'</div></div>').join('')+'<div class="box gold"><b>Add a prize</b><div class="row"><input type="text" id="pName" class="wide" placeholder="e.g. 🎧 Headphones" style="width:14em"><label>after <input type="number" id="pNeed" min="1" max="120" value="30"> days</label><button class="btn sm" id="addP">Add</button></div><p class="muted" style="font-size:.9rem">Tip: make each new prize a little harder than the last.</p></div>'}
  if(tab==='settings'){body='<div class="row"><label>Math questions per day <select id="sItems">'+[6,8,10,12].map(n=>'<option '+(n===(D.settings.items||10)?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>Break length <select id="sBreak">'+[30,45,60,90].map(n=>'<option value="'+n+'" '+(n===(D.settings.breakSecs||45)?'selected':'')+'>'+n+' sec</option>').join('')+'</select></label></div><div class="row"><label>Her name <input type="text" id="sName" value="'+esc(D.name)+'"></label><label>Avatar <select id="sAv">'+['🦄','🐱','🦊','🐼','🦋','🌟','🐬','🦩'].map(a=>'<option '+(a===D.avatar?'selected':'')+'>'+a+'</option>').join('')+'</select></label><label>Grown-up code <input type="text" id="sCode" value="'+esc(D.settings.parentCode||'2013')+'"></label></div><div class="row"><button class="btn sm" id="saveS">Save settings</button></div><hr style="border:0;border-top:1px solid var(--line)"><div class="row"><button class="btn ghost sm" id="resetDay">Reset today\'s quests</button><button class="btn ghost sm" id="exportB">Export everything (copy)</button><button class="btn ghost sm" id="wipe">Start over completely</button></div><p class="muted" style="font-size:.9rem">Progress lives on this iPad in the browser. Export before switching devices, then paste into the Import box on the new one.</p><div class="row"><input type="text" id="importT" class="wide" placeholder="paste export here"><button class="btn ghost sm" id="importB">Import</button></div><p class="muted" style="font-size:.9rem">Microphone: '+(MIC==='yes'?'working':MIC==='no'?'not available on this page (use the hosted link in Safari and tap Allow)':'not tested yet')+'. Version '+VERSION+'.</p>'}
  if(tab==='report'){const txt=reportText();body='<textarea id="rep" style="width:100%;min-height:260px;font:inherit;font-size:.95rem;border-radius:12px;border:2px solid var(--line);padding:10px;background:var(--card);color:var(--fg)">'+esc(txt)+'</textarea><div class="row"><button class="btn sm" id="copyR">Copy</button><a class="btn sm" style="text-decoration:none;display:inline-block" id="mailR" href="mailto:bahmedov82@gmail.com?subject='+encodeURIComponent('Camila\'s Quest · '+todayKey())+'&body='+encodeURIComponent(txt)+'">✉️ Email to Dad</a></div>'}
  render('<div class="row" style="justify-content:space-between"><h2>Grown-ups</h2><button class="btn ghost sm" id="back">Back to Camila</button></div><div class="row">'+tabs.map(([k,n])=>'<button class="btn sm '+(k===tab?'':'ghost')+' ptab" data-t="'+k+'">'+n+'</button>').join('')+'</div>'+body);
  $('back').onclick=home;document.querySelectorAll('.ptab').forEach(b=>b.onclick=()=>parentPanel(b.dataset.t));
  document.querySelectorAll('.setlv').forEach(s=>s.onchange=()=>{const k=s.dataset.k;sk(k).level=+s.value;save();parentPanel('skills')});
  if($('setStory'))$('setStory').onchange=()=>{D.reading.level=+$('setStory').value;save();parentPanel('skills')};
  document.querySelectorAll('.rmP').forEach(b=>b.onclick=()=>{D.prizes.splice(+b.dataset.i,1);save();hud();parentPanel('prizes')});
  document.querySelectorAll('.doneP').forEach(b=>b.onclick=()=>{D.prizes[+b.dataset.i].earned=todayKey();save();hud();parentPanel('prizes')});
  if($('addP'))$('addP').onclick=()=>{const n=$('pName').value.trim();if(!n)return;D.prizes.push({name:n,need:Math.max(1,parseInt($('pNeed').value||'30',10)),start:D.dayStars,earned:null,added:new Date().toISOString()});save();hud();parentPanel('prizes')};
  if($('saveS'))$('saveS').onclick=()=>{D.settings.items=+$('sItems').value;D.settings.breakSecs=+$('sBreak').value;D.name=$('sName').value.trim()||D.name;D.avatar=$('sAv').value;D.settings.parentCode=$('sCode').value.trim()||'2013';save();parentPanel('settings')};
  if($('resetDay'))$('resetDay').onclick=()=>{if(confirm('Reset today\'s quests? Skill levels are kept.')){delete D.days[todayKey()];save();hud();parentPanel('today')}};
  if($('wipe'))$('wipe').onclick=()=>{if(confirm('Erase ALL progress, levels, and prizes on this device?')){localStorage.removeItem(KEY);location.reload()}};
  if($('exportB'))$('exportB').onclick=async()=>{const s=JSON.stringify(D);try{await navigator.clipboard.writeText(s);$('exportB').textContent='Copied ✓'}catch(e){prompt('Copy this:',s)}};
  if($('importB'))$('importB').onclick=()=>{try{const o=JSON.parse($('importT').value);if(o&&o.skills){localStorage.setItem(KEY,JSON.stringify(o));location.reload()}}catch(e){alert('That did not look like an export.')}};
  if($('copyR'))$('copyR').onclick=async()=>{try{await navigator.clipboard.writeText($('rep').value);$('copyR').textContent='Copied ✓'}catch(e){$('rep').select()}};
}

function welcome(){
  render('<div class="stars">🏝️</div><h1 class="center">Welcome to your Quest, Camila!</h1><p class="center">Every day has six short quests: brain sparks, math, words, a story, speaking, and typing. Finish all six and you earn a day star. Day stars earn real prizes.</p><p class="center">Pick your character:</p><div class="row" style="justify-content:center" id="av">'+['🦄','🐱','🦊','🐼','🦋','🌟','🐬','🦩'].map(a=>'<button class="opt" style="font-size:2.4rem;min-height:0;padding:12px 16px" data-a="'+a+'">'+a+'</button>').join('')+'</div><div class="row" style="justify-content:center"><button class="btn good" id="go" style="font-size:1.5rem">Let\'s go!</button></div>');
  speak('Welcome to your quest, Camila! Every day has six short quests. Finish all six and you earn a day star. Day stars earn real prizes. Pick your character!');
  document.querySelectorAll('#av .opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('#av .opt').forEach(x=>x.classList.remove('right'));b.classList.add('right');D.avatar=b.dataset.a;save()});
  $('go').onclick=()=>{D.welcomed=true;save();home()};
}
$('ver').textContent='v'+VERSION;
$('musicBtn').onclick=()=>setMusic(!MUSIC);setMusic(MUSIC);
$('parentLink').onclick=parentGate;
hud();
if(location.hash==='#debug')window.__cq={D,run:k=>QUESTS.find(q=>q.key===k).run(home),home,parentPanel,save};
if(D.welcomed)home();else welcome();
})();
</script>

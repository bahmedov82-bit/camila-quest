<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camila's Quest">
<meta name="theme-color" content="#2f6bff">
<title>Camila's Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#eef3ff; --bg2:#e4f7f1; --card:#ffffff; --fg:#1f2443; --muted:#5d6486;
  --accent:#ff4fa3; --accent2:#2f6bff; --coin:#ffb400; --good:#19a974; --soft:#f1f3ff; --line:#d9deef; --goodbg:#d8f6ea; --badbg:#ffe0ef;
  --f-display:'Fredoka','Nunito',system-ui,sans-serif; --f-body:'Nunito',system-ui,sans-serif;
  --r:22px; --shadow:0 10px 0 0 #cfd6f2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a33;--bg2:#13262a;--card:#232749;--fg:#f3f4ff;--muted:#b4b9d8;--soft:#2b305a;--line:#3a3f6d;--shadow:0 10px 0 0 #0f1128;--goodbg:#1d4a3a;--badbg:#5a2340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171a33;--bg2:#13262a;--card:#232749;--fg:#f3f4ff;--muted:#b4b9d8;--soft:#2b305a;--line:#3a3f6d;--shadow:0 10px 0 0 #0f1128;--goodbg:#1d4a3a;--badbg:#5a2340;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--fg);font-family:var(--f-body);font-size:19px;line-height:1.45;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:calc(100% - 28px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.3px}
.hud{display:flex;gap:8px;align-items:center;font-family:var(--f-display);font-weight:600;flex-wrap:wrap}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:var(--coin);box-shadow:inset 0 -3px 0 #d79400;display:inline-block}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2.1rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.btn{font-family:var(--f-display);font-weight:600;font-size:1.25rem;border:0;border-radius:18px;padding:16px 22px;cursor:pointer;color:#fff;background:var(--accent2);box-shadow:0 6px 0 0 #1d4fd0;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 0 #1d4fd0}
.btn.pink{background:var(--accent);box-shadow:0 6px 0 0 #c92f7b}.btn.pink:active{box-shadow:0 2px 0 0 #c92f7b}
.btn.ghost{background:var(--soft);color:var(--fg);box-shadow:0 6px 0 0 var(--line)}.btn.ghost:active{box-shadow:0 2px 0 0 var(--line)}
.btn.good{background:var(--good);box-shadow:0 6px 0 0 #0f7a52}.btn.good:active{box-shadow:0 2px 0 0 #0f7a52}
.btn.sm{font-size:1rem;padding:10px 14px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--coin);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.center{text-align:center}
.quests{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.quest{background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;font-family:var(--f-display);text-align:left;cursor:pointer;color:var(--fg);font-size:1.05rem}
.quest .em{font-size:2rem}
.quest.done{border-color:var(--good);background:var(--goodbg)}
.quest.now{border-color:var(--accent);box-shadow:0 0 0 4px #ff4fa333}
.quest.locked{opacity:.55;cursor:default}
.quest .sub{font-size:.9rem;color:var(--muted);font-family:var(--f-body)}
.prompt{font-family:var(--f-display);font-size:2.4rem;font-weight:600;text-align:center;line-height:1.2;text-wrap:balance}
.prompt.small{font-size:1.5rem;font-weight:500}
.word{font-size:3.4rem;letter-spacing:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{font-family:var(--f-display);font-size:2rem;font-weight:600;background:var(--soft);color:var(--fg);border:3px solid var(--line);border-radius:18px;padding:22px 10px;cursor:pointer;min-height:84px}
.opt:active{transform:translateY(2px)}
.opt.right{background:var(--goodbg);border-color:var(--good)} .opt.wrong{background:var(--badbg);border-color:var(--accent)}
.opt.txt{font-size:1.35rem;font-weight:500;text-align:left;padding:16px}
.visual{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:40px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--accent2)}
.dot.b{background:var(--accent)}
.tenframe{display:grid;grid-template-columns:repeat(5,34px);gap:5px;background:var(--card);padding:6px;border:3px solid var(--fg);border-radius:8px}
.cell{width:34px;height:34px;border:2px solid var(--fg);border-radius:6px;display:flex;align-items:center;justify-content:center}
.cell .dot{width:22px;height:22px}
.group{display:flex;gap:4px;padding:6px;border:2px dashed var(--muted);border-radius:10px;flex-wrap:wrap;max-width:140px}
.rod{width:14px;height:90px;background:var(--accent2);border-radius:4px;display:inline-block}
.one{width:16px;height:16px;background:var(--coin);border-radius:3px;display:inline-block}
.bar{height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
.feedback{font-family:var(--f-display);font-size:1.5rem;text-align:center;min-height:1.8em}
.passage{font-size:1.45rem;line-height:1.8;max-width:34em;margin:0 auto;background:var(--soft);padding:18px 22px;border-radius:16px}
.sentence{font-family:var(--f-display);font-size:1.9rem;line-height:1.5;text-align:center;background:var(--soft);padding:18px 22px;border-radius:16px}
.parent{border:3px dashed var(--accent2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.parent .tag{font-family:var(--f-display);font-weight:700;color:var(--accent2);font-size:.95rem;letter-spacing:1px;text-transform:uppercase}
.box{border:3px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.box.gold{border-color:var(--coin)}
input[type=number],input[type=text],input[type=password],select{font:inherit;font-size:1.2rem;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);width:7em}
input[type=text].wide{width:min(90%,22em)}
table{border-collapse:collapse;width:100%;font-size:1rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);color:var(--muted);font-weight:600}
.stars{font-size:2.6rem;letter-spacing:4px;text-align:center}
.big{font-size:3rem;text-align:center;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.speak{background:none;border:2px solid var(--line);border-radius:999px;width:46px;height:46px;font-size:1.3rem;cursor:pointer;color:var(--fg)}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 6px}
.shape{display:grid;gap:3px;border:3px solid var(--fg);border-radius:8px;padding:3px;background:var(--card)}
.shape i{display:block;width:34px;height:34px;background:var(--card);border:1px solid var(--line)}
.shape i.on{background:var(--accent)}
.tableWrap{overflow-x:auto}
.chip{display:inline-block;margin:4px;padding:6px 12px;border-radius:10px;background:var(--soft);font-family:var(--f-display)}
.chip.ok{background:var(--goodbg)} .chip.bad{background:var(--badbg)}
.tword{padding:2px 4px;border-radius:6px;display:inline-block}
.tword.miss{background:var(--accent);color:#fff}
.badge{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:14px;background:var(--soft);min-width:84px;font-size:.8rem;text-align:center}
.badge .em{font-size:1.8rem}
.badge.off{opacity:.35;filter:grayscale(1)}
.streak{font-family:var(--f-display);font-size:1.1rem}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:460px){.prompt{font-size:1.9rem}.word{font-size:2.6rem}.opt{font-size:1.6rem;padding:16px 8px}body{font-size:17px}.sentence{font-size:1.5rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand" id="brand">🏝️ Camila's Quest</div>
    <div class="hud"><span class="pill"><span class="coin"></span><span id="coins">0</span></span><span class="pill">⭐ <span id="stars">0</span></span><span class="pill" id="streakPill">🔥 <span id="streak">0</span></span><button class="pill" id="musicBtn" style="cursor:pointer;font:inherit;color:inherit" aria-pressed="false">🎵 My music: off</button></div>
  </div>
  <div id="prizebar" class="row" style="gap:10px"></div>
  <div class="card" id="screen"></div>
  <p class="muted center" style="font-size:.9rem">Tap 🔊 on any screen to hear it. Take your time, there is no clock. <button id="parentLink" style="background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline">Grown-ups</button> · <span id="ver"></span></p>
</div>
<script>
(function(){
'use strict';
const VERSION='1.0';
